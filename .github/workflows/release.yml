name: 发布插件

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: 打包并发布
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取并校验版本
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(?<version>(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*))$') {
            throw "Tag 必须使用 vX.Y.Z 格式：$tag"
          }
          "PLUGIN_VERSION=$($Matches.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 生成发布包
        shell: pwsh
        run: |
          .\scripts\package.ps1 -Version $env:PLUGIN_VERSION

      - name: 创建 Release 并上传插件包
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = "dist\openbidkit-pet-v$env:PLUGIN_VERSION.zip"
          gh release create "${{ github.ref_name }}" $archive `
            --verify-tag `
            --title "易标桌宠 ${{ github.ref_name }}" `
            --generate-notes
