<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'"
  >
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>易标桌宠视觉层</title>
  <link rel="stylesheet" href="bubble.css">
  <link rel="stylesheet" href="pet.css">
  <link rel="stylesheet" href="drag-preview.css">
</head>
<body>
  <div id="dragPreviewBubbleWindow" class="drag-preview__bubble-window">
    <main
      id="statusBubble"
      class="bubble"
      data-tone="idle"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    >
      <div class="bubble__copy">
        <div id="bubbleTitle" class="bubble__title">当前无执行任务</div>
        <div id="bubbleDetail" class="bubble__detail">小易正在待命</div>
      </div>
      <button id="bubbleAiButton" class="bubble__ai-button" type="button" title="AI 对话" aria-label="打开 AI 对话">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 4.5 13.8 9.2 18.5 11 13.8 12.8 12 17.5 10.2 12.8 5.5 11 10.2 9.2z" />
          <path d="M18.6 4.4v3.2" />
          <path d="M17 6h3.2" />
          <path d="M6.2 16.6v2.8" />
          <path d="M4.8 18h2.8" />
        </svg>
      </button>
    </main>
  </div>
  <div id="petSprite" class="pet__sprite drag-preview__sprite" role="img" aria-label="小易"></div>
  <script src="bubble.js"></script>
  <script src="pet.js"></script>
  <script src="drag-preview.js"></script>
</body>
</html>
