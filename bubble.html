<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self'; script-src 'self'"
  >
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>易标桌宠状态</title>
  <link rel="stylesheet" href="bubble.css">
</head>
<body>
  <main
    id="statusBubble"
    class="bubble"
    data-tone="idle"
    role="status"
    aria-live="polite"
    aria-atomic="true"
  >
    <div class="bubble__copy">
      <div id="bubbleTitle" class="bubble__title">当前无执行任务</div>
      <div id="bubbleDetail" class="bubble__detail">小易正在待命</div>
    </div>
    <span id="bubbleIcon" class="bubble__icon" aria-hidden="true">•</span>
  </main>
  <script src="bubble.js"></script>
</body>
</html>
